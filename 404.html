<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Page not found</title>
  <script>
    // GitHub Pages paths are case-sensitive. Redirect case-mismatched URLs
    // (e.g. /research/humain/) to their canonical spelling.
    (function () {
      var CANONICAL = ['/research/HumAIN'];
      var path = location.pathname;
      var lower = path.toLowerCase();
      for (var i = 0; i < CANONICAL.length; i++) {
        var c = CANONICAL[i];
        var cl = c.toLowerCase();
        if ((lower === cl || lower.indexOf(cl + '/') === 0) && path.indexOf(c) !== 0) {
          location.replace(c + path.slice(c.length) + location.search + location.hash);
          return;
        }
      }
    })();
  </script>
  <style>
    body { font-family: 'IBM Plex Sans', sans-serif; background: #fff; color: #1a1a18;
           display: flex; flex-direction: column; align-items: center; justify-content: center;
           min-height: 100vh; margin: 0; padding: 0 16px; text-align: center; }
    a { color: #00462a; }
  </style>
</head>
<body>
  <h1>404</h1>
  <p>Page not found. <a href="/">Go to the AIR Lab homepage</a></p>
</body>
</html>
